name: Pulso comment dialog consistency V3.6.81
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'src/**/pulso*'
      - 'src/**/reel*'
      - 'public/**/pulso*'
      - 'public/**/reel*'
      - 'tests/pulso-*'
      - 'tests/reel-*'
# Solo la versión más reciente del PR necesita estas pruebas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  comments:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Validate comment modal, stale requests and social controls
        run: node --test tests/pulso-comments-consistency-v3681.test.js tests/pulso-long-session-v3680.test.js tests/pulso-pagination-recovery-v3673.test.js
