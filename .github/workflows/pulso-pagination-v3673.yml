name: Pulso pagination recovery V3.6.73

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pulso-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Validate paging, empty blocks, controlled retries and privacy
        run: node --test tests/pulso-pagination-recovery-v3673.test.js
