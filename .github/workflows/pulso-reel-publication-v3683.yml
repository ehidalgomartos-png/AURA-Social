name: Pulso publication status V3.6.83
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  publish-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify publication visibility, moderation and upload regressions
        run: node --test tests/pulso-reel-publication-v3683.test.js tests/pulso-reel-preview-v3667.test.js tests/pulso-reel-upload-v3668.test.js tests/pulso-reel-published-v3669.test.js
