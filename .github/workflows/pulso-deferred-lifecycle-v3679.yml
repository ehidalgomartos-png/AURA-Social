name: Pulso deferred lifecycle restore V3.6.79
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check BFCache, mobile freeze/resume and playback regressions
        run: node --test tests/pulso-deferred-lifecycle-v3679.test.js tests/pulso-resume-network-v3678.test.js tests/pulso-playback-lifecycle-v3670.test.js tests/pulso-fast-swipe-v3676.test.js tests/pulso-network-v3675.test.js
