name: Pulso Reel upload V3.6.68

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  reel-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify real upload progress and recovery
        run: node --test tests/pulso-reel-upload-v3668.test.js
