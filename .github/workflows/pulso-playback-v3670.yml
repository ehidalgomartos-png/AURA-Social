name: Pulso playback lifecycle V3.6.70

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'src/**/pulso*'
      - 'src/**/reel*'
      - 'public/**/pulso*'
      - 'public/**/reel*'
      - 'tests/pulso-*'
      - 'tests/reel-*'
# Solo la versión más reciente del PR necesita estas pruebas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pulso-playback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check mobile swipes, single playback and tab return
        run: node --test tests/pulso-playback-lifecycle-v3670.test.js
