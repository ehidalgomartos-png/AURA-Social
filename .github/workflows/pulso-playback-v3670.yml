name: Pulso playback lifecycle V3.6.70

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pulso-playback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check mobile swipes, single playback and tab return
        run: node --test tests/pulso-playback-lifecycle-v3670.test.js
