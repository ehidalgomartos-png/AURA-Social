name: Pulso lifecycle recovery V3.6.74
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'src/**/pulso*'
      - 'src/**/reel*'
      - 'public/**/pulso*'
      - 'public/**/reel*'
      - 'tests/pulso-*'
      - 'tests/reel-*'
# Solo la versión más reciente del PR necesita estas pruebas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pulso-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Run V3.6.74 and V3.6.73 regressions
        run: node --test tests/pulso-lifecycle-v3674.test.js tests/pulso-pagination-recovery-v3673.test.js
