name: Pulso lifecycle recovery V3.6.74
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  pulso-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Run V3.6.74 and V3.6.73 regressions
        run: node --test tests/pulso-lifecycle-v3674.test.js tests/pulso-pagination-recovery-v3673.test.js
