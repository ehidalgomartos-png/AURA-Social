name: Pulso Reel published V3.6.69

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  published-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Validate Reel success, access and privacy
        run: node --test tests/pulso-reel-published-v3669.test.js
