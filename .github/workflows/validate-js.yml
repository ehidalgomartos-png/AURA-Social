name: RedLibertad JavaScript checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Legal timeline regression tests
        run: npm run test:legal
      - name: Social, PWA and authentication smoke tests
        run: npm run test:smoke
      - name: Mobile social experience regression tests
        run: npm run test:social
      - name: Discover 3.0 ranking and UI tests
        run: npm run test:discovery
      - name: User activation guide tests
        run: npm run test:activation
      - name: Push preferences and notification tests
        run: npm run test:notifications
