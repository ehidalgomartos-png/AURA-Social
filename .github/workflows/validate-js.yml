name: RedLibertad JavaScript checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies for HTTP route integration tests
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Legal timeline regression tests
        run: npm run test:legal
      - name: Social, PWA and authentication smoke tests
        run: npm run test:smoke
      - name: Mobile social experience regression tests
        run: npm run test:social
      - name: Discover 3.0 ranking and UI tests
        run: npm run test:discovery
      - name: User activation guide tests
        run: npm run test:activation
      - name: V3.1 first-community activation, privacy and mobile regressions
        run: npm run test:community-kickstart
      - name: V3.2.1 secure RSS and editorial review inbox tests
        run: npm run test:editorial-rss
      - name: V3.2.2 human editorial approval and safety tests
        run: npm run test:editorial-review
      - name: V3.2.3 editorial public publishing and attribution tests
        run: npm run test:editorial-publishing
      - name: V3.2.4 authentic editorial likes comments and community sharing
        run: npm run test:editorial-social
      - name: V3.2.5 editorial analytics and human quality gate tests
        run: npm run test:editorial-quality
      - name: V3.2.6 editorial manual planning, filters and selection tests
        run: npm run test:editorial-planning
      - name: V3.2.7 editorial daily workflow and manual-only safety tests
        run: npm run test:editorial-daily
      - name: V3.2.11 editorial social visual integration and accessibility tests
        run: npm run test:editorial-social-ui
      - name: V3.2.12 editorial integration, session and news sitemap tests
        run: npm run test:editorial-integration
      - name: V3.2.13 automatic draft suggestions and editorial deep-link tests
        run: npm run test:editorial-drafts-nav
      - name: V3.2.14 editorial mobile navigation and Communities safe-return tests
        run: npm run test:editorial-nav-hotfix
      - name: Editorial intelligence regression
        run: npm run test:editorial-intelligence
      - name: V3.2.16 topic diversity, RSS draft and mobile editorial workflow tests
        run: npm run test:editorial-workflow
      - name: V3.2.17 editorial provenance, original text and source checks
        run: npm run test:editorial-provenance
      - name: V3.2.17.1 original editorial draft and approval validation regression
        run: npm run test:editorial-originality-hotfix
      - name: V3.2.18 editorial queue filtering, mobile review and safety tests
        run: npm run test:editorial-queue
      - name: V3.2.18.1 editorial publication alignment and safe repair tests
        run: npm run test:editorial-alignment
      - name: V3.2.19 protected RSS source deletion and preservation regression tests
        run: npm run test:editorial-source-removal
      - name: V3.2.20 RSS attribution snapshots and missing-source review filter tests
        run: npm run test:editorial-orphans
      - name: V3.2.21 RSS source reconnection and human-review safety tests
        run: npm run test:editorial-relink
      - name: V3.2.22 RSS image security, license and manual publishing regression tests
        run: npm run test:editorial-images
      - name: V3.2.23 safe HTTPS article metadata and manual editorial draft import tests
        run: npm run test:editorial-web-import
      - name: V3.2.24 clean Home and two-posts-one-news privacy regression tests
        run: npm run test:home-clean
      - name: V3.2.24.1 mobile homepage highlights and single Story regression tests
        run: npm run test:home-mobile-polish
      - name: V3.2.24.2 reviewed news rotation and public profile login regression tests
        run: npm run test:home-news-profile
      - name: V3.2.24.3 lone Story mobile layout and multi-Story regression tests
        run: npm run test:home-solo-story
      - name: V3.2.25 admin-only visibility counts and mobile diagnostic tests
        run: npm run test:editorial-visibility
      - name: V3.2.26 real activity, new-post indicator and privacy regressions
        run: npm run test:home-real-activity
      - name: V3.2.27 mobile Post and Story composer, privacy and accessibility regressions
        run: npm run test:composer-mobile
      - name: V3.2.28 three composer tabs, prominent classification and preserved publication safeguards
        run: npm run test:composer-three-modes
      - name: V3.2.29 direct conversation notification routing and privacy regressions
        run: npm run test:direct-conversations
      - name: V3.2.30 active public discussions and Explore privacy regression tests
        run: npm run test:active-discussions
      - name: V3.2.36 my conversations, responsive filters and privacy regressions
        run: npm run test:my-conversations
      - name: V3.2.36 mobile Explore sections and compatibility regressions
        run: npm run test:explore-mobile-sections
      - name: V3.2.36 mobile on-demand global search regression tests
        run: npm run test:mobile-global-search
      - name: V3.2.36 mobile comment participation and modal safety regressions
        run: npm run test:mobile-comment-participation
      - name: V3.2.36 session-only drafts, reply context and submission safety
        run: npm run test:comment-drafts
      - name: V3.2.36 manual comment refresh, scroll and draft preservation
        run: npm run test:comment-refresh
      - name: Mobile navigation icon, dock opacity and small-screen regression tests
        run: npm run test:mobile-nav
      - name: Own profile full posts, tabs and mobile interaction regression tests
        run: npm run test:own-profile
      - name: Production media persistence and sitemap safety audit regression tests
        run: npm run test:production-safety
      - name: Profile main-view, full posts, SEO copy and mobile regressions
        run: npm run test:profile-experience
      - name: Google public-profile snippets, markup and privacy regression tests
        run: npm run test:profile-seo
      - name: Search Console, unseen Stories and mobile visual regression tests
        run: npm run test:hotfix
      - name: V3 launch config, SEO, PWA and privacy gate regressions
        run: npm run test:launch-gates
      - name: Privacy-safe community retention regression tests
        run: npm run test:retention
      - name: Growth cohorts, attribution and dashboard regression tests
        run: npm run test:growth-center
      - name: SEO acquisition, public guides and signup safety tests
        run: npm run test:seo-acquisition
      - name: Safe release verification and smoke regression tests
        run: npm run test:release-verification
      - name: Optional operational alert delivery regression tests
        run: npm run test:delivery
      - name: Operational alerts and incident response regression tests
        run: npm run test:ops-alerts
      - name: Dependency recovery and operations regression tests
        run: npm run test:recovery
      - name: Observability and reliability regression tests
        run: npm run test:observability
      - name: Mobile performance and PWA cache regression tests
        run: npm run test:performance
      - name: Advanced security regression tests
        run: npm run test:security
      - name: Push preferences and notification tests
        run: npm run test:notifications
