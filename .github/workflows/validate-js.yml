name: RedLibertad JavaScript checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies for HTTP route integration tests
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: V3.2.63.3 Marketplace chat layout, send and duplicate draft regression
        run: npm run test:marketplace-chat-polish
      - name: V3.2.64 seller product identifiers and Google readiness
        run: npm run test:marketplace-google
      - name: V3.2.64.2 WooCommerce variants with parent metadata and image safety
        run: npm run test:marketplace-variations
      - name: V3.2.64.3 Marketplace Explore / My Listings / Favorites tab switch regression
        run: npm run test:marketplace-tabs
      - name: V3.2.65 product card images, mobile quick filters, nationwide sale
        run: npm run test:marketplace-catalog
      - name: V3.2.66 Marketplace public mobile cleanup and PWA retirement
        run: npm run test:marketplace-mobile-clean
      - name: V3.2.67 mobile product labels and descriptions
        run: npm run test:marketplace-readability
      - name: V3.2.68 public categories, nationwide sale and search quality
        run: npm run test:marketplace-public-discovery
      - name: V3.2.69 opt-in Marketplace community sharing
        run: npm run test:marketplace-community
      - name: V3.2.70.1 Marketplace safe photo sharing and button contrast
        run: npm run test:marketplace-photo-hotfix
      - name: Startup Express route export smoke test
        run: npm run test:startup-router
      - name: Legal timeline regression tests
        run: npm run test:legal
      - name: Social, PWA and authentication smoke tests
        run: npm run test:smoke
      - name: Mobile social experience regression tests
        run: npm run test:social
      - name: Discover 3.0 ranking and UI tests
        run: npm run test:discovery
      - name: User activation guide tests
        run: npm run test:activation
      - name: V3.1 first-community activation, privacy and mobile regressions
        run: npm run test:community-kickstart
      - name: V3.2.1 secure RSS and editorial review inbox tests
        run: npm run test:editorial-rss
      - name: V3.2.2 human editorial approval and safety tests
        run: npm run test:editorial-review
      - name: V3.2.3 editorial public publishing and attribution tests
        run: npm run test:editorial-publishing
      - name: V3.2.4 authentic editorial likes comments and community sharing
