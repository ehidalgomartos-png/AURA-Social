name: RedLibertad JavaScript checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies for HTTP route integration tests
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Legal timeline regression tests
        run: npm run test:legal
      - name: Social, PWA and authentication smoke tests
        run: npm run test:smoke
      - name: Mobile social experience regression tests
        run: npm run test:social
      - name: Discover 3.0 ranking and UI tests
        run: npm run test:discovery
      - name: User activation guide tests
        run: npm run test:activation
      - name: Privacy-safe community retention regression tests
        run: npm run test:retention
      - name: Growth cohorts, attribution and dashboard regression tests
        run: npm run test:growth-center
      - name: SEO acquisition, public guides and signup safety tests
        run: npm run test:seo-acquisition
      - name: Safe release verification and smoke regression tests
        run: npm run test:release-verification
      - name: Optional operational alert delivery regression tests
        run: npm run test:delivery
      - name: Operational alerts and incident response regression tests
        run: npm run test:ops-alerts
      - name: Dependency recovery and operations regression tests
        run: npm run test:recovery
      - name: Observability and reliability regression tests
        run: npm run test:observability
      - name: Mobile performance and PWA cache regression tests
        run: npm run test:performance
      - name: Advanced security regression tests
        run: npm run test:security
      - name: Push preferences and notification tests
        run: npm run test:notifications
