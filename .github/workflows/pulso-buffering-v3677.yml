name: Pulso buffering feedback V3.6.77
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  buffering:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Validate buffering, interruptions, playback and privacy
        run: node --test tests/pulso-buffering-v3677.test.js tests/pulso-playback-lifecycle-v3670.test.js tests/pulso-fast-swipe-v3676.test.js tests/pulso-network-v3675.test.js tests/pulso-lifecycle-v3674.test.js
