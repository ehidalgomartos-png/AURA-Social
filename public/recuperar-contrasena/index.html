<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c2036">
  <title>Recuperar contraseña — RedLibertad</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/account-help-v321313.css">
</head>
<body>
  <main class="account-shell">
    <section class="account-card" aria-labelledby="resetTitle">
      <div class="account-brand"><span class="account-brand-dot" aria-hidden="true"></span>REDLIBERTAD</div>
      <h1 id="resetTitle">Recupera tu contraseña</h1>
      <p class="account-intro">Te enviaremos un enlace para establecer una contraseña nueva.</p>

      <form id="requestResetForm" class="account-form">
        <label class="account-field" for="accountEmail">
          Correo electrónico
          <input id="accountEmail" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="tu@email.com">
        </label>
        <button class="account-primary" type="submit">Enviar enlace de recuperación</button>
      </form>

      <form id="confirmResetForm" class="account-form" hidden>
        <label class="account-field" for="newPassword">
          Nueva contraseña
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        </label>
        <label class="account-field" for="repeatPassword">
          Repite la contraseña
          <input id="repeatPassword" name="repeatPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        </label>
        <button class="account-primary" type="submit">Guardar nueva contraseña</button>
        <p class="account-secondary">Por seguridad, el enlace caduca a los 30 minutos.</p>
      </form>

      <p id="status" class="account-status" role="status" aria-live="polite"></p>

      <div class="account-divider" role="separator"></div>
      <nav class="account-links" aria-label="Volver al acceso">
        <a class="account-link" href="/#acceso">Volver a RedLibertad <span class="arrow" aria-hidden="true">›</span></a>
      </nav>
    </section>
  </main>
  <script src="/password-recovery-v321311.js"></script>
</body>
</html>
