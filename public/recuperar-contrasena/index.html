<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d2238">
<title>Recuperar contraseña — RedLibertad</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}
  body{margin:0;padding:24px;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#0c2036;color:#f7f9ff}
  main{min-height:calc(100dvh - 48px);display:grid;place-items:center}
  section{width:min(480px,100%);padding:28px;border:1px solid #34506a;border-radius:18px;background:#142e48}
  h1{font-size:clamp(25px,6vw,32px);line-height:1.2;margin-top:0}
  a{color:#9bd8ff}label{display:block;margin:22px 0 8px}
  input{background:#24435f;color:#fff;border:1px solid #67829c;border-radius:10px;padding:14px;width:100%;font:inherit}
  button{border:0;border-radius:12px;padding:15px;width:100%;font:inherit;font-weight:700;color:white;background:#ef695d;cursor:pointer;margin-top:15px}
  button:disabled{opacity:.6;cursor:wait}p{line-height:1.6}
  [hidden]{display:none!important}#status{min-height:1.5em}
</style>
</head><body>
<main><section>
<a href="/">← RedLibertad</a>
<h1>Recupera tu contraseña</h1>
<form id="requestResetForm">
  <p>Escribe el email de tu cuenta y te enviaremos un enlace para establecer una contraseña nueva.</p>
  <label for="accountEmail">Correo electrónico</label>
  <input id="accountEmail" name="email" type="email" autocomplete="email" maxlength="254" required>
  <button type="submit">Enviar enlace de recuperación</button>
</form>
<form id="confirmResetForm" hidden>
  <p>Introduce una nueva contraseña de al menos 10 caracteres.</p>
  <label for="newPassword">Nueva contraseña</label>
  <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
  <label for="repeatPassword">Repite la contraseña</label>
  <input id="repeatPassword" name="repeatPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
  <button type="submit">Guardar nueva contraseña</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="/#acceso">Volver a entrar</a></p>
</section></main>
<script src="/password-recovery-v321311.js"></script>
</body></html>
